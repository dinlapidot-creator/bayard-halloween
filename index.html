<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayard After Dark – House Showdown 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --orange: #ff6b00;
    --gold: #ffb347;
    --purple: #7b2cbf;
    --dark: #050505;
    --card: rgba(20, 8, 12, 0.92);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--dark);
    color: #f5e6d3;
    padding-bottom: 100px;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(255,107,0,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, rgba(123,44,191,0.12) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  header {
    text-align: center;
    padding: 28px 16px 12px;
    position: relative;
    z-index: 10;
  }
  header h1 {
    font-family: 'Creepster', cursive;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    background: linear-gradient(135deg, #ffb347, #ff6b00, #ff4500);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255,107,0,0.4);
    letter-spacing: 1px;
  }
  header p {
    margin-top: 6px;
    font-size: 1rem;
    opacity: 0.85;
    letter-spacing: 0.5px;
  }
  #map {
    height: 58vh;
    width: 100%;
    border-bottom: 1px solid rgba(255,107,0,0.3);
    position: relative;
    z-index: 5;
  }
  .ghost {
    position: absolute;
    bottom: 20px;
    left: 18px;
    z-index: 1000;
    font-size: 48px;
    pointer-events: none;
    animation: float 3.5s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-14px) rotate(4deg); }
  }
  #tracker {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(10, 5, 8, 0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,107,0,0.4);
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    z-index: 500;
    align-items: center;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.6);
  }
  .cat-pill {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    transition: all 0.2s ease;
  }
  .cat-pill.done {
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    border-color: #4caf50;
    color: #e8f5e9;
    box-shadow: 0 0 12px rgba(76,175,80,0.4);
  }
  .cat-pill .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #ffb347;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .cat-pill.done .dot {
    background: #fff;
    border-color: #fff;
    color: #1b5e20;
  }
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 16px;
    backdrop-filter: blur(6px);
  }
  .modal-content {
    background: var(--card);
    border-radius: 20px;
    max-width: 540px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 22px;
    border: 1px solid rgba(255,107,0,0.35);
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .modal h2 {
    font-family: 'Creepster', cursive;
    font-size: 1.8rem;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .photos {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin: 14px 0 18px;
    padding-bottom: 6px;
  }
  .photos img {
    height: 210px;
    min-width: 190px;
    object-fit: cover;
    border-radius: 14px;
    cursor: pointer;
    border: 2px solid rgba(255,107,0,0.3);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  .cat-option {
    padding: 14px 16px;
    margin: 8px 0;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.2s ease;
  }
  .cat-option:hover {
    border-color: var(--orange);
    background: rgba(255,107,0,0.08);
    transform: translateY(-1px);
  }
  .cat-option strong { display: block; font-size: 1rem; }
  .cat-option span { font-size: 0.84rem; opacity: 0.75; }
  .btn {
    background: linear-gradient(135deg, var(--orange), #ff4500);
    color: #000;
    border: none;
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 14px;
    box-shadow: 0 4px 16px rgba(255,107,0,0.35);
  }
  .house-label {
    background: linear-gradient(135deg, var(--orange), #ff4500);
    color: #000;
    border: 2px solid #fff;
    border-radius: 50%;
    font-weight: 700;
    font-size: 11px;
    text-align: center;
    width: 36px;
    height: 36px;
    line-height: 32px;
    box-shadow: 0 0 10px var(--orange);
  }
  .house-label.voted {
    background: #4caf50 !important;
    color: #fff !important;
    box-shadow: 0 0 14px #4caf50;
  }
</style>
</head>
<body>
<header>
  <h1>Bayard After Dark</h1>
  <p>Tap a house on the map • See the photos • Cast your vote</p>
</header>
<div style="position:relative;">
  <div id="map"></div>
  <div class="ghost">👻</div>
</div>
<div id="tracker"></div>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-content">
    <h2 id="modal-title">House</h2>
    <div class="photos" id="modal-photos"></div>
    <p style="margin-bottom:12px; font-size:0.95rem; opacity:0.9;">Which category does this house win?</p>
    <div id="modal-categories"></div>
    <button class="btn" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
const CATEGORIES = [
  {name: "Most Likely to Be Reported to the HOA", desc: "The most over-the-top display"},
  {name: "Visible from Space", desc: "So dazzling the astronauts are taking pictures"},
  {name: "Most Likely to Raise the Electric Bill", desc: "Basically its own power plant"},
  {name: "Grave Mistake", desc: "Funniest tombstone epitaphs"},
  {name: "Skeleton Crew", desc: "Skeletons doing everyday things"},
  {name: "Inflatable Overload", desc: "The lawn with the most blow-up chaos"},
  {name: "The Neighbors Are Concerned", desc: "Has everyone asking questions"},
  {name: "Last-Minute Legend", desc: "Went up Oct 30th and somehow works"},
  {name: "Boo-dget Friendly", desc: "Maximum spooky on minimum spending"},
  {name: "Nightmare on Our Street", desc: "So creepy the trick-or-treaters walk faster"}
];

const HOUSES = [
  {num:"5017", lat:34.0074842, lon:-84.2096983, photos:["IMG_1275.jpg","IMG_1276.jpg","IMG_1277.jpg","IMG_1278.jpg","IMG_1279.jpg","IMG_1280.jpg","IMG_1281.jpg","IMG_1282.jpg"]},
  {num:"5018", lat:34.0076564, lon:-84.2102729, photos:["IMG_1283.jpg","IMG_1284.jpg","IMG_1285.jpg","IMG_1286.jpg","IMG_1287.jpg","IMG_1288.jpg","IMG_1289.jpg","IMG_1290.jpg"]},
  {num:"5024", lat:34.0075810, lon:-84.2107710, photos:["IMG_1292.jpg","IMG_1293.jpg"]},
  {num:"5030", lat:34.0075579, lon:-84.2110019, photos:["IMG_1294.jpg","IMG_1295.jpg","IMG_1296.jpg","IMG_1297.jpg","IMG_1298.jpg","IMG_1299.jpg","IMG_1300.jpg"]},
  {num:"5041", lat:34.0074769, lon:-84.2103361, photos:["IMG_1268.jpg","IMG_1269.jpg","IMG_1270.jpg","IMG_1271.jpg","IMG_1272.jpg","IMG_1273.jpg"]},
  {num:"5047", lat:34.0074190, lon:-84.2107350, photos:["IMG_1263.jpg","IMG_1264.jpg","IMG_1265.jpg","IMG_1266.jpg","IMG_1267.jpg"]},
  {num:"5096", lat:34.0061646, lon:-84.2128950, photos:["IMG_1301.jpg","IMG_1302.jpg","IMG_1303.jpg"]},
  {num:"5101", lat:34.0064146, lon:-84.2127376, photos:["IMG_1304.jpg","IMG_1312.jpg","IMG_1309.jpg","IMG_1310.jpg","IMG_1311.jpg"]},
  {num:"5137", lat:34.0058448, lon:-84.2116320, photos:["IMG_1197.jpg","IMG_1198.jpg","IMG_1199.jpg","IMG_1200.jpg","IMG_1203.jpg","IMG_1204.jpg","IMG_1205.jpg"]},
  {num:"5149", lat:34.0056777, lon:-84.2111336, photos:["IMG_1189.jpg","IMG_1190.jpg","IMG_1191.jpg","IMG_1192.jpg","IMG_1193.jpg","IMG_1194.jpg","IMG_1195.jpg","IMG_1196.jpg"]},
  {num:"5155", lat:34.0055917, lon:-84.2108850, photos:["IMG_1186.jpg","IMG_1187.jpg","IMG_1188.jpg"]},
  {num:"5162", lat:34.0051431, lon:-84.2105100, photos:["IMG_1160.jpg","IMG_1162.jpg","IMG_1163.jpg","IMG_1164.jpg"]},
  {num:"5167", lat:34.0053152, lon:-84.2104382, photos:["IMG_1165.jpg","IMG_1166.jpg","IMG_1167.jpg","IMG_1168.jpg","IMG_1169.jpg"]},
  {num:"5185", lat:34.0050588, lon:-84.2097010, photos:["IMG_1178.jpg","IMG_1179.jpg","IMG_1180.jpg","IMG_1181.jpg","IMG_1182.jpg","IMG_1183.jpg","IMG_1184.jpg"]},
  {num:"5191", lat:34.0048520, lon:-84.2095510, photos:["IMG_1171.jpg","IMG_1172.jpg","IMG_1173.jpg","IMG_1175.jpg","IMG_1176.jpg","IMG_1177.jpg"]},
  {num:"9130", lat:34.0065250, lon:-84.2128532, photos:["IMG_1313.jpg","IMG_1314.jpg","IMG_1315.jpg","IMG_1316.jpg","IMG_1317.jpg"]}
];

let votes = JSON.parse(localStorage.getItem("bayardSimpleVotes") || "{}");
let markers = {};

const map = L.map('map').setView([34.0063, -84.2112], 16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const bounds = [];
HOUSES.forEach(h => {
  const icon = L.divIcon({className:'house-label', html:h.num, iconSize:[36,36], iconAnchor:[18,18]});
  const m = L.marker([h.lat, h.lon], {icon}).addTo(map);
  markers[h.num] = m;
  m.on('click', () => openHouse(h));
  bounds.push([h.lat, h.lon]);
});
map.fitBounds(bounds, {padding:[30,30]});

function openHouse(h) {
  document.getElementById('modal-title').textContent = h.num + " Dinant Dr";
  const photosEl = document.getElementById('modal-photos');
  photosEl.innerHTML = h.photos.length
    ? h.photos.map(p => `<img src="${p}" alt="${h.num}">`).join('')
    : '<p style="opacity:0.6;">No photos yet</p>';
  const catsEl = document.getElementById('modal-categories');
  const used = new Set(Object.values(votes));
  catsEl.innerHTML = CATEGORIES.map(c => {
    const taken = used.has(c.name) && votes[h.num] !== c.name;
    if (taken) return '';
    return `<div class="cat-option" data-house="${h.num}" data-cat="${c.name}">
      <strong>${c.name}</strong>
      <span>${c.desc}</span>
    </div>`;
  }).join('');
  catsEl.querySelectorAll('.cat-option').forEach(el => {
    el.onclick = () => vote(el.dataset.house, el.dataset.cat);
  });
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
function vote(houseNum, catName) {
  for (let h in votes) {
    if (votes[h] === catName) delete votes[h];
  }
  votes[houseNum] = catName;
  localStorage.setItem("bayardSimpleVotes", JSON.stringify(votes));
  closeModal();
  updateMarkers();
  renderTracker();
}
function updateMarkers() {
  HOUSES.forEach(h => {
    const voted = votes[h.num];
    const icon = L.divIcon({
      className: 'house-label' + (voted ? ' voted' : ''),
      html: h.num + (voted ? ' ✓' : ''),
      iconSize: [voted ? 42 : 36, voted ? 42 : 36],
      iconAnchor: [voted ? 21 : 18, voted ? 21 : 18]
    });
    markers[h.num].setIcon(icon);
  });
}
function renderTracker() {
  const el = document.getElementById('tracker');
  const votedCats = new Set(Object.values(votes));
  el.innerHTML = CATEGORIES.map(c => {
    const done = votedCats.has(c.name);
    return `<div class="cat-pill ${done?'done':''}">
      <span class="dot">${done ? '✓' : ''}</span>
      ${c.name}
    </div>`;
  }).join('');
}
updateMarkers();
renderTracker();
</script>
</body>
</html>
